name: Run Reproduce Metrics

on:
  workflow_dispatch: {}

jobs:
  run-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f filess/hr-attrition-analytics/hr-attrition-analytics/requirements.txt ]; then
            pip install -r filess/hr-attrition-analytics/hr-attrition-analytics/requirements.txt || true
          fi
          # Ensure required libraries for reproduce_metrics.py are present
          pip install --no-cache-dir imbalanced-learn xgboost joblib pandas scikit-learn scipy
          # SHAP is optional and can be heavy; install only if desired
          pip install --no-cache-dir shap || true

      - name: List data/raw (debug)
        run: ls -la filess/hr-attrition-analytics/hr-attrition-analytics/data || true

      - name: Run reproduce_metrics.py
        run: python filess/hr-attrition-analytics/hr-attrition-analytics/reproduce_metrics.py

      - name: Commit outputs
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "Add generated model outputs (model_metrics, ttest, feature importances)"
          push: true
          add: 'filess/hr-attrition-analytics/hr-attrition-analytics/outputs'
